<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Exercise - AI Student Helper</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-green-500 text-white p-4">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">Professor Portal</h1>
            <div class="space-x-4">
                <a href="/grade" class="hover:underline">Grade Exercises</a>
                <a href="/" class="bg-white text-green-500 px-4 py-2 rounded">Logout</a>
            </div>
        </div>
    </nav>
    <div class="container mx-auto p-8">
        <h2 class="text-2xl font-bold mb-6">Create New Exercise</h2>
        
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Course</label>
                    <select id="course" class="w-full p-2 border rounded-lg">
                        {% for course in courses %}
                        <option value="{{ course.id }}">{{ course.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Type</label>
                    <select id="type" class="w-full p-2 border rounded-lg">
                        <option value="quiz">Practice Quiz</option>
                        <option value="exam">Exam</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Difficulty (1-10)</label>
                    <input type="number" id="difficulty" min="1" max="10" value="5" class="w-full p-2 border rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Exercise Text</label>
                    <textarea id="text" class="w-full p-2 border rounded-lg" rows="4" placeholder="Enter the exercise question..."></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Solution</label>
                    <textarea id="solution" class="w-full p-2 border rounded-lg" rows="2" placeholder="Enter the correct solution..."></textarea>
                </div>
                <button onclick="suggestLabels()" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded">
                    Suggest Labels
                </button>
            </div>
        </div>
        
        <!-- Suggested Labels -->
        <div id="labels-section" class="hidden bg-white rounded-lg shadow-md p-6 mb-6">
            <h3 class="text-xl font-semibold mb-4">Suggested Labels</h3>
            <div id="suggested-labels" class="space-y-2 mb-4"></div>
            <div class="flex space-x-2">
                <input type="text" id="custom-label" class="flex-1 p-2 border rounded-lg" placeholder="Or add custom label">
                <button onclick="addCustomLabel()" class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded">
                    Add
                </button>
            </div>
            <div id="selected-labels" class="mt-4">
                <p class="text-sm text-gray-600 mb-2">Selected labels:</p>
                <div id="selected-labels-list" class="flex flex-wrap gap-2"></div>
            </div>
            <button onclick="submitExercise()" class="mt-4 bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded">
                Submit Exercise
            </button>
        </div>
    </div>
    
    <script>
        let exerciseId = null;
        let selectedLabels = [];
        
        async function suggestLabels() {
            const course = document.getElementById('course').value;
            const text = document.getElementById('text').value;
            const type = document.getElementById('type').value;
            const difficulty = document.getElementById('difficulty').value;
            const solution = document.getElementById('solution').value;
            
            if (!text.trim()) {
                alert('Please enter exercise text');
                return;
            }
            
            try {
                // First create the exercise
                const createResponse = await fetch('/api/create-exercise', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        course_id: parseInt(course),
                        text: text,
                        solution: solution,
                        difficulty: parseInt(difficulty),
                        type: type
                    })
                });
                const createData = await createResponse.json();
                exerciseId = createData.exercise_id;
                
                // Then suggest labels
                const suggestResponse = await fetch('/api/suggest-labels', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        course_id: parseInt(course),
                        text: text,
                        solution: solution,
                        difficulty: parseInt(difficulty),
                        type: type
                    })
                });
                const suggestData = await suggestResponse.json();
                
                // Show suggested labels
                const labelsSection = document.getElementById('labels-section');
                const suggestedLabelsDiv = document.getElementById('suggested-labels');
                suggestedLabelsDiv.innerHTML = '';
                
                suggestData.suggested_labels.forEach(label => {
                    const div = document.createElement('div');
                    div.innerHTML = `
                        <label class="flex items-center space-x-2">
                            <input type="checkbox" value="${label}" onchange="toggleLabel('${label}')">
                            <span>${label}</span>
                        </label>
                    `;
                    suggestedLabelsDiv.appendChild(div);
                });
                
                labelsSection.classList.remove('hidden');
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }
        
        function toggleLabel(label) {
            if (selectedLabels.includes(label)) {
                selectedLabels = selectedLabels.filter(l => l !== label);
            } else {
                selectedLabels.push(label);
            }
            updateSelectedLabels();
        }
        
        function addCustomLabel() {
            const input = document.getElementById('custom-label');
            const label = input.value.trim();
            if (label && !selectedLabels.includes(label)) {
                selectedLabels.push(label);
                updateSelectedLabels();
                input.value = '';
            }
        }
        
        function updateSelectedLabels() {
            const list = document.getElementById('selected-labels-list');
            list.innerHTML = '';
            selectedLabels.forEach(label => {
                const span = document.createElement('span');
                span.className = 'bg-blue-100 text-blue-800 px-3 py-1 rounded-full text-sm';
                span.textContent = label;
                list.appendChild(span);
            });
        }
        
        async function submitExercise() {
            if (!exerciseId) {
                alert('Please create an exercise first');
                return;
            }
            
            if (selectedLabels.length === 0) {
                alert('Please select at least one label');
                return;
            }
            
            try {
                const response = await fetch('/api/submit-labels', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        exercise_id: exerciseId,
                        labels: selectedLabels
                    })
                });
                
                alert('Exercise created successfully!');
                location.reload();
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }
    </script>
</body>
</html>
